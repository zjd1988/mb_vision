<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiBeeVision 推送监控</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #111418; color: #d7dce3; margin: 24px; }
  h1 { font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
  .tile { background: #1a1f26; border-radius: 10px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: #8b95a3; }
  .tile .v { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .v.warn { color: #e8a33d; } .v.bad { color: #e05252; } .v.good { color: #58b368; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #262c34; }
  th { color: #8b95a3; font-weight: 500; }
  section { margin: 20px 0; }
  h2 { font-size: 14px; color: #8b95a3; font-weight: 600; }
  #err { color: #e05252; font-size: 13px; }
</style>
</head>
<body>
<h1>MiBeeVision 推送监控</h1>
<div id="err"></div>
<div class="grid" id="tiles"></div>
<section><h2>待回报丢弃范围(未 ack)</h2><table id="drops"><thead>
<tr><th>相机</th><th>原因</th><th>数量</th><th>起始</th><th>结束</th><th>精确 id 数</th></tr>
</thead><tbody></tbody></table></section>
<script>
const fmt = (v, cls) => `<div class="tile"><div class="k">${v.k}</div><div class="v ${cls||''}">${v.v}</div></div>`;
async function refresh() {
  try {
    const d = await (await fetch('/monitor/json')).json();
    document.getElementById('err').textContent = '';
    const m = d.metrics || {};
    const tiles = [
      {k:'状态', v:d.status, cls: d.status==='healthy'?'good':'bad'},
      {k:'段队列', v:`${d.seg_bus.depth}/${d.seg_bus.capacity}`},
      {k:'解码队列', v:`${d.decoded_bus.depth}/${d.decoded_bus.capacity}`},
      {k:'解码 worker', v:`${m.decode_workers}(忙 ${m.workers_busy})`},
      {k:'在途段', v:d.in_flight},
      {k:'已处理', v:d.processed},
      {k:'命中事件', v:m.events_emitted, cls:'good'},
      {k:'累计丢弃', v:m.dropped_total, cls: m.dropped_total>0?'warn':''},
      {k:'丢弃(满队/TTL)', v:`${m.dropped_queue_full}/${m.dropped_ttl}`},
      {k:'段耗时 p50/p90', v:`${(m.seg_ms_p50/1000).toFixed(1)}s/${(m.seg_ms_p90/1000).toFixed(1)}s`},
      {k:'内存可用', v:m.mem_available_mb+'MB', cls: m.mem_available_mb>0&&m.mem_available_mb<600?'warn':''},
      {k:'load1', v:m.load1},
    ];
    document.getElementById('tiles').innerHTML = tiles.map(fmt).join('');
    const tb = document.querySelector('#drops tbody');
    tb.innerHTML = (d.drop_ranges||[]).map(r =>
      `<tr><td>${r.camera_id}</td><td>${r.reason}</td><td>${r.count}</td><td>${r.from}</td><td>${r.to}</td><td>${(r.ids||[]).length}</td></tr>`
    ).join('') || '<tr><td colspan="6">无</td></tr>';
  } catch (e) { document.getElementById('err').textContent = '刷新失败: ' + e; }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
